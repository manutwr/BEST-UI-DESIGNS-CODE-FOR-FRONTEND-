<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cyber Robot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="bg-grid"></div>

    <div class="scene">
        
        <div class="robot-glow" id="robotGlow"></div>
        
        <div class="ear ear-left" id="earL"></div>
        <div class="ear ear-right" id="earR"></div>

        <div class="robot-head" id="robotHead">
            
            <div class="forehead"></div>
            
            <div class="visor">
                <div class="eye">
                    <div class="pupil"></div>
                </div>
                <div class="eye">
                    <div class="pupil"></div>
                </div>
            </div>

            <div class="jaw">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
